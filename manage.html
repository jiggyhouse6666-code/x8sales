<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a090e;--card:#14121a;--card2:#1b1822;--line:rgba(230,195,120,.22);--gold:#e6c378;--gold2:#c99a3e;--text:#f3eee2;--dim:#9b94a6;--pos:#38caa0;--neg:#e5535a;--warn:#f0a84a;--silver:#c9ccd4;--bronze:#d08a52}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans JP',-apple-system,'Hiragino Sans',sans-serif;font-size:15px;line-height:1.55}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:16px}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
header.top{position:sticky;top:0;z-index:20;background:rgba(10,9,14,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 0 10px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:'Oswald',sans-serif;font-weight:700;letter-spacing:2px;color:var(--gold);font-size:19px}
.brand small{font-family:'Noto Sans JP';font-weight:500;letter-spacing:0;color:var(--dim);font-size:12px;margin-left:8px}
.who{font-size:12px;color:var(--dim);text-align:right}
.who b{color:var(--gold);font-weight:500}
main{padding-top:14px}
h1.pt{font-size:20px;margin:2px 0 12px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:13px;font-weight:500;color:var(--dim);letter-spacing:1px}
.card.warn{border-color:rgba(229,83,90,.55);background:#1c1216}
.big{font-family:'Oswald','Noto Sans JP';font-weight:700;font-size:32px;line-height:1.15;color:var(--gold);white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:520px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.kpi .l{font-size:11px;color:var(--dim)}
.kpi .v{font-family:'Oswald','Noto Sans JP';font-weight:700;font-size:30px;color:var(--text);line-height:1.2}
.kpi .v small{font-size:13px;color:var(--dim);font-weight:500;margin-left:2px}
.kpi .d{font-size:11px;color:var(--dim)}
.kpi.alert .v{color:var(--neg)}
.up{color:var(--pos)}.down{color:var(--neg)}.dim{color:var(--dim)}.gold{color:var(--gold)}
.bar{height:10px;background:#27232f;border-radius:6px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:6px}
.bar.ok>i{background:linear-gradient(90deg,#2a9d7c,var(--pos))}
.prow{margin-bottom:12px}.prow .t{display:flex;justify-content:space-between;font-size:13px}
.btn{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a1408;border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:16px;width:100%}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:13px;width:auto;border-radius:10px}
.btn.red{background:#5a2229;color:#ffd6da}
.btn:disabled{opacity:.4}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}.btnrow .btn{flex:1}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;background:none;border:0;border-radius:9px;padding:9px 4px;color:var(--dim);font-size:14px}
.seg button.on{background:var(--gold);color:#1a1408;font-weight:700}
.nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px}
.nav b{min-width:150px;text-align:center;font-family:'Oswald','Noto Sans JP';font-size:17px}
.nav button{background:var(--card);border:1px solid var(--line);border-radius:10px;width:40px;height:36px;color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--dim)}
.chip.on{background:var(--gold);color:#1a1408;border-color:var(--gold);font-weight:700}
.badge{display:inline-block;border-radius:6px;padding:1px 8px;font-size:11px;font-weight:700;vertical-align:middle}
.b-red{background:#5a2229;color:#ffd6da}.b-gold{background:#3b3014;color:var(--gold)}.b-grn{background:#123a2e;color:#8ff0cf}.b-gry{background:#2a2733;color:var(--dim)}.b-blu{background:#1a2c44;color:#9cc7ff}
.list>.it{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid rgba(255,255,255,.07)}
.list>.it:first-child{border-top:0}
.it .grow{flex:1;min-width:0}.it .nm{font-weight:700}.it .sub{font-size:12px;color:var(--dim)}
.av{width:44px;height:44px;border-radius:50%;background:#2a2430;display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:700;overflow:hidden;flex:none;border:1px solid var(--line)}
.av img{width:100%;height:100%;object-fit:cover}.av.lg{width:72px;height:72px;font-size:26px}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th{font-weight:500;color:var(--dim);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tb td{padding:8px 4px;text-align:right;border-bottom:1px solid rgba(255,255,255,.06);font-variant-numeric:tabular-nums}
table.tb th:first-child,table.tb td:first-child{text-align:left}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
label.f{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{min-height:76px;resize:vertical}
.err{color:#ffb4ba;font-size:13px;margin-top:6px;min-height:1px}
.note{font-size:12px;color:var(--dim)}
.step{display:flex;align-items:center;gap:8px}
.step button{width:52px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--gold);font-size:24px;flex:none}
.step input{text-align:center;font-family:'Oswald';font-size:24px;font-weight:700;height:48px;padding:0}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,.06)}
.frow:first-of-type{border-top:0}.frow .fl{font-size:14px;flex:1}.frow .step{width:178px;flex:none}
.sv{position:sticky;bottom:calc(57px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);padding:8px 0;z-index:5}
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,9,14,.97);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.bot .in{display:flex;width:100%;max-width:720px}
nav.bot button{flex:1;background:none;border:0;padding:9px 2px 8px;color:var(--dim);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bot button .ic{font-size:21px;line-height:1}
nav.bot button.on{color:var(--gold)}
#sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;padding:16px 14px calc(18px + env(safe-area-inset-bottom));display:none}
#sheet .in{max-width:720px;margin:0 auto}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-90px);background:#22201a;border:1px solid var(--gold);color:var(--text);padding:10px 18px;border-radius:12px;z-index:99;transition:.25s;max-width:90vw;font-size:14px}
#okdlg{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:24px}#okdlg .bx{background:#1c1a16;border:1px solid var(--gold);border-radius:14px;padding:18px;max-width:360px;width:100%;color:var(--text);font-size:14px;line-height:1.6;white-space:pre-wrap}#okdlg .br{display:flex;gap:10px;margin-top:16px}#okdlg button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--gold);background:transparent;color:var(--text);font-size:15px}#okdlg button.y{background:var(--gold);color:#111;font-weight:700}
#toast.show{transform:translateX(-50%) translateY(0)}

<script type="module">
/* =====================================================================
   X8 営業管理 (X8 SALES MANAGEMENT)
   データ: Firebase (プロジェクト x8open) の Firestore。 mg_* コレクション。
   ログイン: 売上アプリ(me.html)と同じ個人アカウント / 管理者 admin@x8sales.app
   権限は Firestore ルール(サーバー側)で制限。 画面側の表示切替は見やすさのため。
   長期運用: 期限付きの仕組みなし。バージョン固定のSDK。月別ドキュメントで肥大化しない。
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBMkuBSZ75otzTCNT2fdFsxcHaTGk86Lz4",
  authDomain: "x8open.firebaseapp.com",
  projectId: "x8open",
  storageBucket: "x8open.firebasestorage.app",
  messagingSenderId: "222731309583",
  appId: "1:222731309583:web:3df818ef2166159d77097a"
};
const ADMIN_EMAIL = 'admin@x8sales.app';
const FB_VER = '12.19.0';
const BUILD = 'mg-1 - 2026-11-09';
const MG_COLS = ['mg_cast','mg_reports','mg_goals','mg_coach','mg_rot','mg_meta'];

const FIELDS = [
  {k:'line',l:'LINE交換人数',g:'act'},{k:'lineRej',l:'LINE交換を断られた件数',g:'act'},
  {k:'sns',l:'SNS投稿回数',g:'act'},{k:'tel',l:'電話営業件数',g:'act'},{k:'offsite',l:'店外営業件数',g:'act'},
  {k:'okuri',l:'送りのお客様への連絡件数',g:'act'},{k:'nomi',l:'飲み直しのお客様への連絡件数',g:'act'},
  {k:'newVisit',l:'新規来店獲得数',g:'res'},{k:'shimei',l:'指名卓獲得数',g:'res'},{k:'planned',l:'来店予定人数',g:'res'},
  {k:'prospect',l:'来店見込み人数',g:'res'},{k:'visitActual',l:'営業による来店実績',g:'res'}
];
const FL = Object.fromEntries(FIELDS.map(f => [f.k, f.l]));
const GOAL_KEYS = [['newVisit','新規'],['shimei','指名卓'],['line','LINE交換'],['tel','電話'],['offsite','店外'],['sns','SNS']];
const REJ = ['タイミングが悪い','担当の店・キャストがいる','まだ早い','交換する気がない','その他'];
const ST = ['未対応','対応中','改善完了'];
const ROT_ITEMS = [['sns','SNSを積極的に活用している'],['new','新規集客に向けて行動している'],['line','LINE営業を実施している'],['tel','電話・店外営業を実施している'],['shimei','指名卓を呼ぶ意識がある']];
const DEF_CFG = { alertLine: 10, poolSize: 9, roleMin: 5, nonMin: 3, nurtureDays: 90, nurtureMin: 1, th: { sns: 7, new: 1, line: 5, tel: 3, shimei: 1 } };

/* ---------- utils ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n) => Math.round(n || 0).toLocaleString('ja-JP');
const yen = (n) => '¥' + fmt(n);
const hexOf = (name) => { const s = String(name == null ? '' : name).normalize('NFKC').trim(); let h = 'u'; for (let i = 0; i < s.length; i++) h += s.charCodeAt(i).toString(16).padStart(4, '0'); return h; };
const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lsDel = (k) => { try { localStorage.removeItem(k); } catch (e) {} };
let toastT; function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
function askOk(msg){ return new Promise(res=>{ const d=document.createElement('div'); d.id='okdlg'; const b=document.createElement('div'); b.className='bx'; const t=document.createElement('div'); t.textContent=msg; const r=document.createElement('div'); r.className='br'; const n=document.createElement('button'); n.textContent='やめる'; const y=document.createElement('button'); y.className='y'; y.textContent='OK'; const done=v=>{ d.remove(); res(v); }; n.onclick=()=>done(false); y.onclick=()=>done(true); r.append(n,y); b.append(t,r); d.append(b); document.body.append(d); }); }
const ymd2d = (s) => new Date(s + 'T00:00:00Z');
const d2ymd = (d) => d.toISOString().slice(0, 10);
const addDays = (s, n) => { const d = ymd2d(s); d.setUTCDate(d.getUTCDate() + n); return d2ymd(d); };
const ymOf = (s) => s.slice(0, 7);
const addMonths = (ym, n) => { let [y, m] = ym.split('-').map(Number); m += n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return y + '-' + String(m).padStart(2, '0'); };
const lastDay = (ym) => { const [y, m] = ym.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).getUTCDate(); };
const dow = (s) => '日月火水木金土'[ymd2d(s).getUTCDay()];
const dlab = (s) => Number(s.slice(5, 7)) + '/' + Number(s.slice(8)) + '(' + dow(s) + ')';
const ymlab = (ym) => ym.slice(0, 4) + '年' + Number(ym.slice(5)) + '月';
// 営業日: 朝6時までは前日扱い（日本時間）
const bizDate = () => d2ymd(new Date(Date.now() + 9 * 3600e3 - 6 * 3600e3));
const pct = (a, b) => b > 0 ? Math.round(a / b * 100) : null;
const initial = (n) => esc(String(n || '?').trim().slice(0, 1));
const avatar = (c, cls) => '<div class="av ' + (cls || '') + '">' + (c && c.photo ? '<img src="' + esc(c.photo) + '" alt="">' : initial(c && c.name)) + '</div>';
const arrow = (cur, prev) => { const d = cur - prev; if (!prev && !cur) return '<span class="dim">-</span>'; return d > 0 ? '<span class="up">▲' + fmt(d) + '</span>' : d < 0 ? '<span class="down">▼' + fmt(-d) + '</span>' : '<span class="dim">±0</span>'; };
function csvCell(v){ const s = String(v == null ? '' : v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function downloadFile(name, text, mime){ const b = new Blob(['﻿' + text], { type: (mime || 'text/csv') + ';charset=utf-8' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
const toCsv = (rows) => rows.map(r => r.map(csvCell).join(',')).join('\r\n');
const num = (v, mx) => { const n = Math.floor(Number(v)); return isFinite(n) && n > 0 ? Math.min(n, mx || 999999) : 0; };

/* ---------- backends ---------- */
const TEST = window.__X8_MG_TEST || null;
let B = null;

async function makeFirebaseBackend(){
  const base = 'https://www.gstatic.com/firebasejs/' + FB_VER + '/';
  const [A, Au, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const app = A.initializeApp(FIREBASE_CONFIG);
  const auth = Au.getAuth(app);
  let db; const EMU = window.__X8_MG_EMU || null;   // テスト用(本番では使われません)
  if (EMU) { db = F.getFirestore(app); F.connectFirestoreEmulator(db, EMU.host, EMU.port); Au.connectAuthEmulator(auth, EMU.auth, { disableWarnings: true }); }
  else { try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); } catch (e) { db = F.getFirestore(app); } }
  const infoOf = (u) => {
    if (!u || !u.email) return null;
    if (u.email === ADMIN_EMAIL) return { role: 'admin' };
    const m = /^(u[0-9a-f]+)@x8sales\.app$/.exec(u.email); return m ? { role: 'member', hex: m[1] } : null;
  };
  let suppress = false, theCb = null;
  const memEmail = (name) => hexOf(name) + '@x8sales.app';
  const fix = (d) => { const o = d.data(); o.id = d.id; return o; };
  return {
    onAuth(cb){ theCb = cb; return Au.onAuthStateChanged(auth, (u) => { if (suppress) return; cb(infoOf(u)); }); },
    async login(admin, name, pw){ await Au.signInWithEmailAndPassword(auth, admin ? ADMIN_EMAIL : memEmail(name), pw); },
    async register(name, code, pw){
      suppress = true; let cred;
      try { cred = await Au.createUserWithEmailAndPassword(auth, memEmail(name), pw); } catch (e) { suppress = false; throw e; }
      try { await F.setDoc(F.doc(db, 'members', hexOf(name)), { uid: cred.user.uid, code: String(code).trim().toUpperCase(), name: String(name).trim(), at: F.serverTimestamp() }); }
      catch (e) { try { await cred.user.delete(); } catch (_) {} try { await Au.signOut(auth); } catch (_) {} suppress = false; const er = new Error('bad-code'); er.code = 'bad-code'; throw er; }
      suppress = false; if (theCb) theCb(infoOf(auth.currentUser));
    },
    async logout(){ await Au.signOut(auth); },
    async setPw(pw){ await Au.updatePassword(auth.currentUser, pw); },
    async setAdminPw(cur, pw){ const u = auth.currentUser; await Au.reauthenticateWithCredential(u, Au.EmailAuthProvider.credential(ADMIN_EMAIL, cur)); await Au.updatePassword(u, pw); },
    async linkUid(hex){ await F.setDoc(F.doc(db, 'mg_uid', auth.currentUser.uid), { hex, at: Date.now() }); },
    async get(col, id){ const s = await F.getDoc(F.doc(db, col, id)); return s.exists() ? fix(s) : null; },
    async set(col, id, obj, merge){ await F.setDoc(F.doc(db, col, id), obj, { merge: merge !== false }); },
    async del(col, id){ await F.deleteDoc(F.doc(db, col, id)); },
    async delDay(col, id, dd){ await F.updateDoc(F.doc(db, col, id), { ['days.' + dd]: F.deleteField() }); },
    async list(col, w){
      const ref = F.collection(db, col);
      const q = w ? F.query(ref, F.where(w[0], w[1], w[2])) : ref;
      return (await F.getDocs(q)).docs.map(fix);
    },
    async setMany(items){
      for (let i = 0; i < items.length; i += 400) {
        const b = F.writeBatch(db); items.slice(i, i + 400).forEach(x => b.set(F.doc(db, x.col, x.id), x.data));
        await b.commit();
      }
    },
    async issueInvite(name){
      const al = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const a = new Uint8Array(8); crypto.getRandomValues(a);
      const code = Array.from(a).map(x => al[x % al.length]).join('');
      await F.setDoc(F.doc(db, 'invites', hexOf(name)), { code, name, at: F.serverTimestamp() });
      return code;
    },
    async members(){ return (await F.getDocs(F.collection(db, 'members'))).docs.map(d => d.id); }
  };
}

function makeMemBackend(T){
  T.docs = T.docs || {}; T.users = T.users || {}; let cb = null, cur = null;
  const col = (c) => (T.docs[c] = T.docs[c] || {});
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const deep = (a, b) => { for (const k in b) { if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object') deep(a[k], b[k]); else a[k] = b[k]; } return a; };
  const info = () => cur ? (cur.admin ? { role: 'admin' } : { role: 'member', hex: cur.hex }) : null;
  const delay = () => new Promise(r => setTimeout(r, T.latency || 0));
  const failCheck = () => { if (T.offline) { const e = new Error('offline'); e.code = 'unavailable'; throw e; } };
  return {
    onAuth(f){ cb = f; setTimeout(() => f(info()), 0); return () => {}; },
    async login(admin, name, pw){ await delay(); if (admin) { if (pw !== T.adminPw) { const e = new Error('x'); e.code = 'auth/invalid-credential'; throw e; } cur = { admin: true }; } else { const u = T.users[hexOf(name)]; if (!u || u.pw !== pw) { const e = new Error('x'); e.code = 'auth/invalid-credential'; throw e; } cur = { hex: hexOf(name) }; } cb(info()); },
    async register(name, code, pw){ const inv = col('invites')[hexOf(name)]; if (!inv || inv.code !== String(code).trim().toUpperCase()) { const e = new Error('bad-code'); e.code = 'bad-code'; throw e; } T.users[hexOf(name)] = { pw }; col('members')[hexOf(name)] = { name }; cur = { hex: hexOf(name) }; cb(info()); },
    async logout(){ cur = null; cb(null); },
    async setPw(pw){ if (cur && cur.hex) T.users[cur.hex].pw = pw; },
    async setAdminPw(c, pw){ if (c !== T.adminPw) { const e = new Error('x'); e.code = 'auth/wrong-password'; throw e; } T.adminPw = pw; },
    async linkUid(hex){ col('mg_uid')[hex] = { hex }; },
    async get(c, id){ await delay(); failCheck(); const d = col(c)[id]; return d ? Object.assign(clone(d), { id }) : null; },
    async set(c, id, obj, merge){ await delay(); failCheck(); const o = clone(obj); if (merge !== false && col(c)[id]) deep(col(c)[id], o); else col(c)[id] = o; },
    async del(c, id){ failCheck(); delete col(c)[id]; },
    async delDay(c, id, dd){ failCheck(); if (col(c)[id] && col(c)[id].days) delete col(c)[id].days[dd]; },
    async list(c, w){ await delay(); failCheck(); return Object.keys(col(c)).map(id => Object.assign(clone(col(c)[id]), { id })).filter(d => { if (!w) return true; const v = d[w[0]]; if (w[1] === '==') return v === w[2]; if (w[1] === 'in') return w[2].includes(v); return true; }); },
    async setMany(items){ items.forEach(x => { col(x.col)[x.id] = clone(x.data); }); },
    async issueInvite(name){ const code = 'TESTCODE'; col('invites')[hexOf(name)] = { code, name }; return code; },
    async members(){ return Object.keys(col('members')); }
  };
}

/* ---------- state ---------- */
const S = {
  me: null,            // { role:'admin'|'operator'|'cast', hex, name, cast }
  casts: {},           // hex -> mg_cast
  R: {},               // hex -> { 'YYYY-MM-DD': report }
  loadedR: {},         // ym -> ms
  goals: {},           // ym -> { hex: goal }
  coach: [], coachAt: 0,
  rot: {},             // ym -> { hex: rot }
  cfg: JSON.parse(JSON.stringify(DEF_CFG)),
  tab: 'home', period: 'day', ref: bizDate(), ym: ymOf(bizDate()),
  scopeAll: false, members: null, salesMonths: null, rk: 'newVisit', rkPeriod: 'month',
  coachF: { st: 'open', cast: '', op: '' }, rep: null, back: null, menuPage: null, castHex: null
};
const isStaff = () => S.me && (S.me.role === 'admin' || S.me.role === 'operator');
const isAdmin = () => S.me && S.me.role === 'admin';

/* ---------- data loading ---------- */
async function loadCasts(){
  if (isStaff()) { const l = await B.list('mg_cast'); S.casts = {}; l.forEach(c => { S.casts[c.id] = c; }); }
  else { const c = await B.get('mg_cast', S.me.hex); S.casts = c ? { [c.id]: c } : {}; }
}
async function loadMeta(){
  const m = isStaff() ? await B.get('mg_meta', 'app') : null;
  S.cfg = JSON.parse(JSON.stringify(DEF_CFG));
  if (m && m.cfg) { Object.assign(S.cfg, m.cfg); S.cfg.th = Object.assign({}, DEF_CFG.th, m.cfg.th || {}); }
}
const monthsBetween = (a, b) => { const o = []; let m = ymOf(a); const e = ymOf(b); while (m <= e && o.length < 40) { o.push(m); m = addMonths(m, 1); } return o; };
async function loadReports(yms, force){
  for (const ym of yms) {
    if (!force && S.loadedR[ym] && Date.now() - S.loadedR[ym] < 30000) continue;
    let docs = [];
    if (isStaff()) docs = await B.list('mg_reports', ['ym', '==', ym]);
    else { const d = await B.get('mg_reports', ym + '_' + S.me.hex); if (d) docs = [d]; }
    Object.keys(S.R).forEach(h => { Object.keys(S.R[h]).forEach(k => { if (k.startsWith(ym)) delete S.R[h][k]; }); });
    docs.forEach(d => { const h = d.owner; S.R[h] = S.R[h] || {}; Object.keys(d.days || {}).forEach(dd => { S.R[h][ym + '-' + dd] = d.days[dd]; }); });
    S.loadedR[ym] = Date.now();
  }
}
async function loadGoals(ym, force){
  if (!force && S.goals[ym] && S.goals[ym]._t && Date.now() - S.goals[ym]._t < 30000) return;
  const g = { _t: Date.now() };
  if (isStaff()) (await B.list('mg_goals', ['ym', '==', ym])).forEach(d => { g[d.owner] = d; });
  else { const d = await B.get('mg_goals', ym + '_' + S.me.hex); if (d) g[d.owner] = d; }
  S.goals[ym] = g;
}
async function loadCoach(force, yms){
  const key = (yms && yms.length ? yms : [S.coachF.ym || ymOf(bizDate())]).join(',');
  if (!force && key === S.coachKey && Date.now() - S.coachAt < 20000) return;
  let l = [];
  if (isStaff()) {
    const a = await B.list('mg_coach', ['status', 'in', [0, 1]]);
    const seen = {}; a.forEach(d => { seen[d.id] = d; });
    for (const ym of key.split(',')) (await B.list('mg_coach', ['ym', '==', ym])).forEach(d => { seen[d.id] = d; });
    l = Object.values(seen);
  } else l = await B.list('mg_coach', ['castHex', '==', S.me.hex]);
  S.coach = l.sort((x, y) => (y.date || '').localeCompare(x.date || '')); S.coachAt = Date.now(); S.coachKey = key;
}
async function loadRot(ym){ const m = {}; (await B.list('mg_rot', ['ym', '==', ym])).forEach(d => { m[d.owner] = d; }); S.rot[ym] = m; }

/* ---------- casts / scope ---------- */
const castList = () => Object.values(S.casts).sort((a, b) => (a.role === b.role ? 0 : a.role === 'operator' ? 1 : -1) || String(a.name).localeCompare(String(b.name), 'ja'));
const isTracked = (c) => c.active !== false && (c.track != null ? c.track : c.role !== 'operator');
const operators = () => castList().filter(c => c.role === 'operator' && c.active !== false);
function scopeCasts(){
  const all = castList().filter(isTracked);
  if (isAdmin() || S.scopeAll) return all;
  return all.filter(c => c.operator === S.me.hex);
}
const castName = (h) => (S.casts[h] && S.casts[h].name) || '(不明)';

/* ---------- aggregation ---------- */
function rangeOf(period, ref){
  if (period === 'day') return { from: ref, to: ref, label: dlab(ref) };
  if (period === 'week') { const d = ymd2d(ref); const k = (d.getUTCDay() + 6) % 7; const from = addDays(ref, -k); const to = addDays(from, 6); return { from, to, label: dlab(from) + ' 〜 ' + dlab(to) }; }
  const ym = ymOf(ref); return { from: ym + '-01', to: ym + '-' + String(lastDay(ym)).padStart(2, '0'), label: ymlab(ym) };
}
function prevRange(period, ref){
  if (period === 'day') return rangeOf('day', addDays(ref, -1));
  if (period === 'week') return rangeOf('week', addDays(ref, -7));
  return rangeOf('month', addMonths(ymOf(ref), -1) + '-01');
}
function stepRef(period, ref, dir){ return period === 'day' ? addDays(ref, dir) : period === 'week' ? addDays(ref, 7 * dir) : addMonths(ymOf(ref), dir) + '-01'; }
function agg(hex, r){
  const t = {}; FIELDS.forEach(f => { t[f.k] = 0; }); t.n = 0; t.snsDays = 0;
  const rep = S.R[hex] || {};
  for (const k in rep) if (k >= r.from && k <= r.to) { const d = rep[k]; FIELDS.forEach(f => { t[f.k] += Number(d[f.k]) || 0; }); if (d.submitted) t.n++; if ((Number(d.sns) || 0) > 0) t.snsDays++; }

  return t;
}
function aggMany(hexes, r){
  const t = {}; FIELDS.forEach(f => { t[f.k] = 0; }); t.n = 0; t.act = 0;
  hexes.forEach(h => { const a = agg(h, r); FIELDS.forEach(f => { t[f.k] += a[f.k]; }); t.n += a.n; t.act += a.act; });
  return t;
}
const daysIn = (r, until) => { const to = r.to < until ? r.to : until; if (to < r.from) return 0; return Math.round((ymd2d(to) - ymd2d(r.from)) / 864e5) + 1; };

function achieve(hex, ym){
  const g = goalOf(ym, hex); const a = agg(hex, rangeOf('month', ym + '-01')); const items = [];
  GOAL_KEYS.forEach(([k, l]) => { const tg = Number(g[k]) || 0; if (tg > 0) items.push({ k, l, tg, v: a[k], p: Math.round(a[k] / tg * 100) }); });
  const rate = items.length ? Math.round(items.reduce((s, x) => s + Math.min(x.p, 150), 0) / items.length) : null;

}

let autoT = null, saving = false, pendingSave = null;

/* ---------- ROTATION (付け回し評価) ---------- */
function rotAuto(hex, end){
  const a = agg(hex, { from: addDays(end, -13), to: end }), th = S.cfg.th;
  return { sns: a.sns >= th.sns, new: a.newVisit + a.planned + a.prospect >= th.new, line: a.line >= th.line, tel: a.tel + a.offsite >= th.tel, shimei: a.shimei + a.planned >= th.shimei, a };
}
function pickRot(items){
  const cfg = S.cfg, ok = items.filter(x => x.pin !== -1);
  const by = (a, b) => b.score - a.score || b.auto.a.act - a.auto.a.act || String(a.c.name).localeCompare(String(b.c.name), 'ja');
  const roles = ok.filter(x => x.isRole).sort(by), non = ok.filter(x => !x.isRole).sort(by);
  const pick = new Set(items.filter(x => x.pin === 1));
  const nR = () => [...pick].filter(x => x.isRole).length, nN = () => [...pick].filter(x => !x.isRole).length, nU = () => [...pick].filter(x => !x.isRole && x.nurture).length;
  for (const x of roles) { if (nR() >= cfg.roleMin) break; pick.add(x); }
  for (const x of non.filter(x => x.nurture)) { if (nU() >= cfg.nurtureMin || nN() >= cfg.nonMin) break; pick.add(x); }
  for (const x of non) { if (nN() >= cfg.nonMin) break; pick.add(x); }
  for (const x of ok.slice().sort(by)) { if (pick.size >= cfg.poolSize) break; pick.add(x); }
  return { list: [...pick].sort((a, b) => (b.isRole ? 1 : 0) - (a.isRole ? 1 : 0) || by(a, b)), shortRole: roles.length < cfg.roleMin, shortNon: non.length < cfg.nonMin };
}
async function vRot(){
  const today = bizDate(), ym = S.ym, end = ym === ymOf(today) ? today : ym + '-' + String(lastDay(ym)).padStart(2, '0');
  await loadReports(monthsBetween(addDays(end, -13), end)); await loadRot(ym);
  const pool = castList().filter(c => c.active !== false && (c.role === 'cast' ? c.rot !== false : c.rot === true));
  if (!pool.length) return `<h1 class="pt">付け回し評価</h1>${monthBar(ym)}${empty('評価するキャストがいません', 'キャスト登録後に表示されます。')}`;

  async goalSave(){ const d = $('#gs'); const t = {}; GOAL_KEYS.forEach(([k]) => { const n = num(val('g_' + k), 99999); if (n) t[k] = n; }); try { await goalWrite(d.dataset.ym, d.dataset.h, t, val('g_note').trim().slice(0, 200)); closeSheet(); toast('保存しました'); refresh(); } catch (e) { $('#g_err').textContent = '保存できませんでした。通信を確認してください。'; } },
  async goalSaveAll(){ const ym = S.ym; let n = 0; try { for (const card of document.querySelectorAll('[data-gh]')) { const t = {}; card.querySelectorAll('[data-gk]').forEach(i => { const v = num(i.value, 99999); if (v) t[i.dataset.gk] = v; }); const old = goalOf(ym, card.dataset.gh); const same = GOAL_KEYS.every(([k]) => (Number(old[k]) || 0) === (t[k] || 0)); if (!same) { await goalWrite(ym, card.dataset.gh, t, null); n++; } } toast(n ? n + '名分を保存しました' : '変更はありません'); } catch (e) { toast('保存できませんでした。通信を確認してください'); } },
  async goalCopy(){ const pm = addMonths(S.ym, -1); await loadGoals(pm, true); let n = 0; document.querySelectorAll('[data-gh]').forEach(card => { const g = goalOf(pm, card.dataset.gh); card.querySelectorAll('[data-gk]').forEach(i => { if (!i.value && g[i.dataset.gk]) { i.value = g[i.dataset.gk]; n++; } }); }); toast(n ? '前月の目標を入れました。「まとめて保存」を押してください' : 'コピーできる目標がありません'); },
  issueEdit(el){ const c = S.casts[el.dataset.v]; openSheet(`<h1 class="pt">${esc(c.name)}の現在の課題</h1><textarea id="is_t" style="min-height:120px">${esc(c.issue || '')}</textarea><div class="err" id="is_e"></div><div class="btnrow" style="margin-top:12px"><button class="btn ghost" data-a="sheetClose">閉じる</button><button class="btn" data-a="issueSave" data-v="${c.id}">保存</button></div>`); },
  async issueSave(el){ const h = el.dataset.v, t = val('is_t').trim().slice(0, 400); try { await B.set('mg_cast', h, { issue: t, updatedAt: Date.now() }, true); S.casts[h].issue = t; closeSheet(); toast('保存しました'); refresh(); } catch (e) { $('#is_e').textContent = '保存できませんでした。'; } },
  castNew(){ castSheet(null); },
  castEdit(el){ castSheet(el.dataset.v); },
  castSave(){ castSave(); },
  importSales(){ importSales(); },
  toggleQuit(){ S.showQuit = !S.showQuit; refresh(); },
  async invite(el){ const c = S.casts[el.dataset.v]; try { const code = await B.issueInvite(c.name); const url = location.href.split('#')[0].split('?')[0]; openSheet(`<h1 class="pt">${esc(c.name)}さんの登録コード</h1><div class="card"><div class="big" style="text-align:center;letter-spacing:4px">${esc(code)}</div></div><div class="note">本人に伝えてください。本人はこのアプリ(<b>${esc(url)}</b>)の「初めての登録」で、名前・コード・自分のパスワードを入れます。すでに売上アプリの個人ページに登録済みの人は、同じ名前・パスワードでそのまま入れます。</div><button class="btn ghost" style="margin-top:12px" data-a="sheetClose">閉じる</button>`); } catch (e) { toast('発行できませんでした'); } },
  exp(el){ doExport(el.dataset.v); },
  bkExport(){ bkExport(); }, bkImport(){ bkImport(); },
  async pwSave(){ const er = $('#pwErr'); er.textContent = ''; const n = val('pw1'); if (n.length < 6) { er.textContent = '6文字以上にしてください'; return; } try { if (isAdmin()) await B.setAdminPw(val('pw0'), n); else await B.setPw(n); toast('パスワードを変更しました'); $('#pw1').value = ''; if ($('#pw0')) $('#pw0').value = ''; } catch (e) { er.textContent = /requires-recent/.test(e.code || '') ? '一度ログアウトして入り直してから、もう一度お試しください。' : /wrong|invalid-cred/.test(e.code || '') ? '今のパスワードが違います。' : '変更できませんでした。'; } },
  async cfgSave(){
    const g = (id, lo, hi) => Math.max(lo, Math.min(hi, Math.floor(Number(val(id))) || 0));
    const cfg = { alertLine: g('cf_alert', 1, 999), poolSize: g('cf_pool', 3, 30), roleMin: g('cf_role', 0, 30), nonMin: g('cf_non', 0, 30), nurtureDays: g('cf_nd', 1, 730), nurtureMin: g('cf_nm', 0, 10), th: { sns: g('cf_sns', 0, 999), new: g('cf_new', 0, 999), line: g('cf_line', 0, 999), tel: g('cf_tel', 0, 999), shimei: g('cf_shi', 0, 999) } };
    try { await B.set('mg_meta', 'app', { cfg, updatedAt: Date.now() }, true); S.cfg = cfg; toast('保存しました'); refresh(); } catch (e) { $('#cfErr').textContent = '保存できませんでした。'; }
  }
};
document.addEventListener('click', (e) => {
  if (e.target.id === 'sheetbg') { closeSheet(); return; }
  const el = e.target.closest('[data-a]'); if (!el || el.tagName === 'SELECT' || (el.tagName === 'INPUT' && el.type === 'date')) return;
  const f = A[el.dataset.a]; if (f) f(el);
});
document.addEventListener('change', async (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.a === 'cfsel') { S.coachF[t.dataset.k] = t.value; refresh(); }
  else if (t.dataset && t.dataset.a === 'repdate') A.repdate(t);
  else if (t.id === 'k_photo' && t.files[0]) { try { pendingPhoto = await resizePhoto(t.files[0]); $('#k_av').innerHTML = avatar({ photo: pendingPhoto, name: '' }, 'lg'); } catch (x) { toast('画像を読み込めませんでした'); } }
});
document.addEventListener('input', (e) => { const t = e.target; if (t.closest && t.closest('#repform') && t.id !== 'f_date') scheduleAuto(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.closest && e.target.closest('.login') && e.target.tagName === 'INPUT') doLogin(); });
window.addEventListener('online', () => toast('通信が戻りました'));
window.addEventListener('offline', () => toast('通信が切れています。入力は端末に保存されます'));

/* ---------- boot ---------- */
(async function boot(){
  try { B = TEST ? makeMemBackend(TEST) : await makeFirebaseBackend(); }
  catch (e) { $('#root').innerHTML = '<div class="login"><div class="logo">X8</div><div class="note" style="margin:24px 0">アプリを読み込めませんでした。電波を確認して、画面を開き直してください。</div><button class="btn" onclick="location.reload()">開き直す</button></div>'; return; }
  window.__X8MG = { S, B };
  B.onAuth((info) => { if (!info) { resetState(); renderLogin(); } else setupUser(info); });
})();
</script>
</body>
</html>
