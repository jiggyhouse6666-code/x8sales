<style>
:root{
  --bg:#0a090e; --card:#14121a; --card2:#1b1822; --line:rgba(230,195,120,.22);
  --gold:#e6c378; --gold2:#c99a3e; --text:#f3eee2; --dim:#9b94a6;
  --pos:#38caa0; --neg:#e5535a; --silver:#c9ccd4; --bronze:#d08a52;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; background:var(--bg); color:var(--text); font-family:'Noto Sans JP',-apple-system,'Hiragino Sans',sans-serif; font-size:15px; line-height:1.55;}
body{min-height:100vh; padding-bottom:calc(76px + env(safe-area-inset-bottom));}
button{font-family:inherit; color:inherit;}
.wrap{max-width:560px; margin:0 auto; padding:0 16px;}
header.top{position:sticky; top:0; z-index:20; background:rgba(10,9,14,.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:calc(10px + env(safe-area-inset-top)) 0 10px;}
.top-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.brand{font-family:'Oswald',sans-serif; font-weight:700; letter-spacing:2px; color:var(--gold); font-size:20px;}
.brand small{font-family:'Noto Sans JP'; font-weight:500; letter-spacing:0; color:var(--dim); font-size:12px; margin-left:8px;}
.iconbtn{background:none; border:1px solid var(--line); border-radius:10px; padding:6px 10px; font-size:13px; color:var(--dim);}
.monthbar{display:flex; align-items:center; justify-content:center; gap:14px; padding-top:8px;}
.monthbar .m{font-family:'Oswald','Noto Sans JP'; font-size:18px; color:var(--text); min-width:140px; text-align:center;}
.monthbar button{background:var(--card); border:1px solid var(--line); border-radius:10px; width:38px; height:34px; font-size:16px; color:var(--gold);}
.monthbar button:disabled{opacity:.25;}
.banner{background:#3a1d22; color:#ffd6da; border-bottom:1px solid #6a2c35; text-align:center; font-size:13px; padding:6px 10px;}
main{padding-top:14px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px;}
.card h2{margin:0 0 10px; font-size:13px; font-weight:500; color:var(--dim); letter-spacing:1px;}
.big{font-family:'Oswald','Noto Sans JP'; font-weight:700; font-size:34px; white-space:nowrap; line-height:1.15; color:var(--gold); letter-spacing:.5px;}
.big.sm{font-size:24px;}
.pair .sl{display:flex; justify-content:space-between; align-items:baseline; margin-top:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,.07);}
.pair .sl b{font-family:'Oswald','Noto Sans JP'; font-size:22px; font-weight:700; color:var(--text); white-space:nowrap;}
.lbl{font-size:12px; color:var(--dim);}
.row2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px;}
.kpis{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px;}
.kpi{background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:10px 8px; text-align:center;}
.kpi .v{font-family:'Oswald'; font-weight:700; font-size:24px; color:var(--text);}
.kpi .l{font-size:11px; color:var(--dim);}
.bar{height:10px; background:#27232f; border-radius:6px; overflow:hidden; margin-top:8px;}

<script>
/* X8 売上管理 — Excel取り込みロジック (ブラウザ/Node 共通)
 *
 * 読むのは「設定」シートと、日別シート「1」〜「31」だけ。
 * 他のシート(ランキング・売上・新・飲…)はExcel内で日別シートから数式計算された
 * 派生物なので読まない。キャスト行は日別シートの3〜42行目、運営行は46〜65行目。
 * 列は固定せず、見出し文字で探す。見つからない見出しがあれば推測せずエラーにする。
 */
(function (root) {
  var METRICS = [
    { key: 'sub',   label: '小計',     header: '売上' },
    { key: 'gross', label: '総売',     header: '総売上' },
    { key: 'shimei',label: '本数(指名)', header: '指' },
    { key: 'douhan',label: '同伴',     header: '同' },
    { key: 'shinki',label: '新規',     header: '新' },
    { key: 'nomi',  label: '飲み直し',  header: '飲' },
    { key: 'help',  label: 'ヘルプ指名', header: 'へ' },
    { key: 'okuri', label: '送り',     header: '送' }
  ];
  var ATT_HEADER = '出勤';
  // 運営メンバーのうち、一覧・ランキングに載せる人(しんさんの指定)
  var OPS_SHOWN = ['るか', 'りお', 'かなた'];

  // 名前の表記ゆれをそろえる（「（運営）」の注記を外し、全角半角をそろえる）
  function cleanName(s) { return String(s == null ? '' : s).normalize('NFKC').replace(/\(運営\)\s*$/, '').trim(); }
  function nameId(name) { var s = cleanName(name), h = 'u'; for (var i = 0; i < s.length; i++) { var c = s.charCodeAt(i).toString(16); h += ('0000' + c).slice(-4); } return h; }

  function colLetter(n) { var s = ''; while (n > 0) { var m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
  function cell(ws, r, c) { return ws[colLetter(c) + r]; }
  function val(ws, r, c) { var x = cell(ws, r, c); return x ? x.v : undefined; }
  function num(v) {
    if (typeof v === 'number') return isFinite(v) ? v : null;
    if (typeof v === 'string') {
      var t = v.replace(/[,，円¥￥\s]/g, '');
      if (t !== '' && !isNaN(Number(t))) return Number(t);
    }
    return null;
  }
  function str(v) { return v == null ? '' : String(v).trim(); }

  function findHeaderCols(ws, headerRow, wanted, maxCol) {
    var found = {};
    for (var c = 1; c <= maxCol; c++) {
      var h = str(val(ws, headerRow, c));
      for (var i = 0; i < wanted.length; i++) {
        if (h === wanted[i] && found[wanted[i]] === undefined) found[wanted[i]] = c;
      }
    }
    return found;
  }

  // 日別シート1枚を読む
  function parseDaySheet(ws, dd, errors) {
    var maxCol = 60;
    var out = { rows: [], excelTotals: { cast: {}, ops: {} }, nameCol: 3 };

    // --- キャスト見出し行(2行目)
    var hdr = 2;
    var want = METRICS.map(function (m) { return m.header; }).concat([ATT_HEADER, '名前']);
    var cols = findHeaderCols(ws, hdr, want, maxCol);
    var missing = want.filter(function (w) { return cols[w] === undefined; });
    if (missing.length) {
      errors.push({ level: 'error', day: dd, msg: '見出しが見つかりません: ' + missing.join(', ') });
      return null;
    }
    var nameCol = cols['名前'], noCol = nameCol - 1;

    function readBlock(startRow, kind) {
      var r = startRow, rows = [];
      for (; r < startRow + 80; r++) {
        var b = str(val(ws, r, noCol));
        if (b === '合計') break;
        var no = num(val(ws, r, noCol));
        if (no === null) continue;
        var name = cleanName(val(ws, r, nameCol));
        var rec = { no: no, name: name, kind: kind, m: {}, att: str(val(ws, r, cols[ATT_HEADER])) };
        METRICS.forEach(function (m) {
          var v = val(ws, r, cols[m.header]);
          var n = num(v);
          rec.m[m.key] = n === null ? 0 : n;
          if (n === null && v !== undefined && v !== '' && v !== null) {
            errors.push({ level: 'warn', day: dd, msg: 'セル ' + colLetter(cols[m.header]) + r + ' の値を数値として読めません: ' + JSON.stringify(v) });
          }
        });
        rows.push(rec);
      }
      // Excelの合計行(突き合わせ用)
      var tot = {};
      METRICS.forEach(function (m) { var n = num(val(ws, r, cols[m.header])); tot[m.key] = n === null ? null : n; });
      return { rows: rows, totals: tot, endRow: r };
    }

    var cast = readBlock(hdr + 1, 'cast');
    out.rows = out.rows.concat(cast.rows);
    out.excelTotals.cast = cast.totals;

    // --- 運営ブロック: 名前列が '運営' の見出し行を探す
    var opsHdr = null;
    for (var r = cast.endRow + 1; r < cast.endRow + 12; r++) {
      if (str(val(ws, r, nameCol)) === '運営') { opsHdr = r; break; }
    }
    if (opsHdr === null) {
      errors.push({ level: 'error', day: dd, msg: '運営ブロックの見出し(「運営」)が見つかりません' });
    } else {
      // 運営見出し行も列が同じか確認
      var cols2 = findHeaderCols(ws, opsHdr, want.filter(function (w) { return w !== '名前'; }), maxCol);
      var bad = Object.keys(cols2).filter(function (k) { return cols2[k] !== cols[k]; });
      var miss2 = want.filter(function (w) { return w !== '名前' && cols2[w] === undefined; });
      if (bad.length || miss2.length) {
        errors.push({ level: 'error', day: dd, msg: '運営ブロックの列配置がキャストと違います: ' + bad.concat(miss2).join(', ') });
      } else {
        var ops = readBlock(opsHdr + 1, 'ops');
        out.rows = out.rows.concat(ops.rows);
        out.excelTotals.ops = ops.totals;
      }
    }
    return out;
  }

  // 日別シート右側の「総売上(カード込み)」(Excelの月間合計の元)を探す
  var DAY_TOTAL_LABEL = '総売上(カード込み)';
  function findDayTotal(ws) {
    for (var r = 1; r <= 20; r++) {
      for (var c = 1; c <= 60; c++) {
        var t = str(val(ws, r, c)).replace(/[（]/g, '(').replace(/[）]/g, ')');
        if (t === DAY_TOTAL_LABEL) {
          for (var k = 1; k <= 4; k++) { var n = num(val(ws, r, c + k)); if (n !== null) return n; }
        }
      }
    }
    return null;
  }

  function isEmptyDay(rows) {
    return !rows.some(function (r) {
      return METRICS.some(function (m) { return r.m[m.key] !== 0; });
    });
  }

  // メイン
  function parseWorkbook(XLSX, data, fileName) {
    var report = { fileName: fileName || '', errors: [], warnings: [], emptyDays: [], checks: [], hidden: [] };
    var wb0 = XLSX.read(data, { type: 'array', bookSheets: true });
    var names = wb0.SheetNames;
    var need = ['設定'];
    for (var d = 1; d <= 31; d++) need.push(String(d));
    var missingSheets = need.filter(function (n) { return names.indexOf(n) < 0; });
    if (missingSheets.indexOf('設定') >= 0) {
      report.errors.push({ level: 'error', msg: '「設定」シートがありません。売上管理のExcelではない可能性があります。' });
      return { month: null, report: report };
    }
    var wb = XLSX.read(data, { type: 'array', sheets: need.filter(function (n) { return names.indexOf(n) >= 0; }) });
    var set = wb.Sheets['設定'];

    var year = num(val(set, 1, 2)), mon = num(val(set, 2, 2));
    if (!year || !mon || mon < 1 || mon > 12) {
      report.errors.push({ level: 'error', msg: '「設定」シートの年(B1)・月(B2)を読めません。' });
      return { month: null, report: report };
    }
    var ym = year + '-' + (mon < 10 ? '0' : '') + mon;
    var daysInMonth = new Date(year, mon, 0).getDate();

    var days = {}, empMap = {}, hiddenTotals = {};
    var validate = [];

    for (var dn = 1; dn <= 31; dn++) {
      var dd = (dn < 10 ? '0' : '') + dn;
      var ws = wb.Sheets[String(dn)];
      if (!ws) { report.warnings.push({ level: 'warn', day: dd, msg: 'シート「' + dn + '」がありません' }); continue; }
      if (dn > daysInMonth) {
        // 31日シートは月によっては存在するだけで日付が無い
        var tmp0 = parseDaySheet(ws, dd, report.errors);
        if (tmp0 && !isEmptyDay(tmp0.rows)) report.errors.push({ level: 'error', day: dd, msg: ym + ' に存在しない日付ですが数字が入っています' });
        continue;
      }
      var p = parseDaySheet(ws, dd, report.errors);
      if (!p) continue;
      if (isEmptyDay(p.rows)) { report.emptyDays.push(dd); continue; }

      var day = { rows: {}, store: {}, hidden: {} };
      METRICS.forEach(function (m) { day.store[m.key] = 0; day.hidden[m.key] = 0; });
      var sums = { cast: {}, ops: {} };
      METRICS.forEach(function (m) { sums.cast[m.key] = 0; sums.ops[m.key] = 0; });

      p.rows.forEach(function (r) {
        METRICS.forEach(function (m) { day.store[m.key] += r.m[m.key]; sums[r.kind][m.key] += r.m[m.key]; });
        var realName = r.name && r.name !== '0' && num(r.name) === null;
        var shown = realName && (r.kind === 'cast' || OPS_SHOWN.indexOf(r.name) >= 0);
        if (!shown) {
          METRICS.forEach(function (m) { day.hidden[m.key] += r.m[m.key]; });
          return;
        }
        var id = nameId(r.name);
        if (!empMap[id]) empMap[id] = { id: id, name: r.name, kind: r.kind, no: r.no };
        var any = METRICS.some(function (m) { return r.m[m.key] !== 0; });
        if (any || r.att) {
          var arr = METRICS.map(function (m) { return r.m[m.key]; });
          arr.push(r.att || '');
          if (day.rows[id]) {
            report.warnings.push({ level: 'warn', day: dd, msg: '同じ名前「' + r.name + '」が同じ日に2行あります。数字を足し合わせました' });
            for (var q = 0; q < 8; q++) arr[q] += day.rows[id][q];
            if (!arr[8]) arr[8] = day.rows[id][8];
          }
          day.rows[id] = arr;
        }
      });

      // Excelの合計行との突き合わせ
      ['cast', 'ops'].forEach(function (k) {
        METRICS.forEach(function (m) {
          var ex = p.excelTotals[k][m.key];
          if (ex === null || ex === undefined) return;
          if (ex !== sums[k][m.key]) {
            report.checks.push({ day: dd, kind: k, metric: m.label, excel: ex, computed: sums[k][m.key] });
          }
        });
      });
      // 店の総売: Excelの日別集計(総売上(カード込み))を採用。個人の合計との差は「担当なし」
      var personGross = day.store.gross;
      var exGross = findDayTotal(ws);
      if (exGross === null) {
        report.warnings.push({ level: 'warn', day: dd, msg: '「総売上(カード込み)」が見つかりません。個人別の合計を使います' });
        day.unas = 0;
      } else {
        day.store.gross = exGross;
        day.unas = exGross - personGross;
      }
      days[dd] = day;
    }

    var employees = Object.keys(empMap).map(function (k) { return empMap[k]; })
      .sort(function (a, b) { return a.no - b.no; });
    var monthObj = {
      ym: ym, year: year, month: mon, daysInMonth: daysInMonth,
      employees: employees.map(function (e) { return { id: e.id, name: e.name, kind: e.kind }; }),
      days: days,
      metrics: METRICS.map(function (m) { return { key: m.key, label: m.label }; })
    };
    return { month: monthObj, report: report };
  }

  var api = { parseWorkbook: parseWorkbook, METRICS: METRICS, OPS_SHOWN: OPS_SHOWN };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.X8Parse = api;
})(typeof window !== 'undefined' ? window : this);

</script>

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n) => Math.round(n || 0).toLocaleString('ja-JP');
const yen = (n) => '¥' + fmt(n);
const man = (n) => n >= 10000 ? (Math.round(n / 1000) / 10) + '万' : fmt(n);
const manS = (n) => n >= 10000000 ? Math.round(n / 10000) + '万' : man(n);
const pair = (g, sb, extraG, extraS) => `<div class="pair"><div class="lbl">総売</div><div class="big">${yen(g)}</div>${extraG || ''}<div class="sl"><span class="lbl">小計</span><b>${yen(sb)}</b></div>${extraS || ''}</div>`;
const val = (m, n) => m.unit === 'yen' ? yen(n) : fmt(n);
const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }
function ymLabel(ym){ const [y, m] = ym.split('-'); return y + '年' + Number(m) + '月'; }
function prevYm(ym){ let [y, m] = ym.split('-').map(Number); m--; if (m < 1) { m = 12; y--; } return y + '-' + (m < 10 ? '0' : '') + m; }
function dayLabel(ym, dd){ const [y, m] = ym.split('-').map(Number); const w = '日月火水木金土'[new Date(y, m - 1, Number(dd)).getDay()]; return m + '/' + Number(dd) + '(' + w + ')'; }

/* ---------- month data helpers ---------- */
const dayList = (M) => Object.keys(M.days).sort();
function storeSum(M, dds){ const t = {}; KEYS8.forEach(k => t[k] = 0); (dds || dayList(M)).forEach(dd => KEYS8.forEach(k => t[k] += (M.days[dd].store[k] || 0))); return t; }
function unasSum(M){ return dayList(M).reduce((a, dd) => a + (M.days[dd].unas || 0), 0); }
function hiddenSum(M){ const t = {}; KEYS8.forEach(k => t[k] = 0); dayList(M).forEach(dd => KEYS8.forEach(k => t[k] += (M.days[dd].hidden && M.days[dd].hidden[k]) || 0)); return t; }
const hexOf = (name) => { const s = String(name == null ? '' : name).normalize('NFKC').trim(); let h = 'u'; for (let i = 0; i < s.length; i++) h += s.charCodeAt(i).toString(16).padStart(4, '0'); return h; };
// 公開用の月データ（個人の日別は入れない）と、個人ごとの日別データに分ける
function splitMonth(M){
  const pub = { ym: M.ym, year: M.year, month: M.month, daysInMonth: M.daysInMonth, employees: M.employees, metrics: M.metrics, days: {}, totals: {} };
  const privs = {};
  M.employees.forEach(e => { privs[e.id] = { days: {} }; const t = new Array(9).fill(0); pub.totals[e.id] = t; });
  Object.keys(M.days).forEach(dd => {
    const d = M.days[dd];
    pub.days[dd] = { rows: {} };  // 店舗の数字は公開用に入れない（管理者用のfullにだけある）
    Object.keys(d.rows).forEach(id => {
      if (!privs[id]) return;
      privs[id].days[dd] = d.rows[id];
      const t = pub.totals[id]; for (let i = 0; i < 8; i++) t[i] += d.rows[id][i] || 0; t[8]++;
    });
  });
  return { pub, privs };
}
function empMonth(M, id){
  if (M.totals) { const a = M.totals[id] || new Array(9).fill(0); const t = a.slice(0, 8); t.days = a[8] || 0; return t; }
  const t = new Array(8).fill(0); let n = 0; dayList(M).forEach(dd => { const r = M.days[dd].rows[id]; if (r) { for (let i = 0; i < 8; i++) t[i] += r[i] || 0; n++; } }); t.days = n; return t; }
function ranking(M, i, dd){
  const list = M.employees.map((e, idx) => ({ id: e.id, name: e.name, kind: e.kind, idx, v: dd ? (((M.days[dd] && M.days[dd].rows[e.id]) || [])[i] || 0) : empMonth(M, e.id)[i] }));
  list.sort((a, b) => b.v - a.v || a.idx - b.idx);
  let rank = 0, prev = null, pos = 0;
  list.forEach(x => { pos++; if (x.v !== prev) { rank = pos; prev = x.v; } x.rank = rank; });
  return list;
}

async function makeFirebaseBackend(){
  const base = 'https://www.gstatic.com/firebasejs/' + FB_VER + '/';
  const [A, Au, F] = await Promise.all([
    import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')
  ]);
  const app = A.initializeApp(FIREBASE_CONFIG);
  const auth = Au.getAuth(app);
  const db = F.getFirestore(app);
  const infoOf = (u) => {
    if (!u || !u.email) return null;
    if (u.email === ADMIN_EMAIL) return { role: 'admin' };
    if (u.email === STAFF_EMAIL) return { role: 'staff' };
    const m = /^(u[0-9a-f]+)@x8sales\.app$/.exec(u.email); return m ? { role: 'member', hex: m[1] } : null;
  };
  let suppress = false, theCb = null, curRole = null;
  const memEmail = (name) => hexOf(name) + '@x8sales.app';
  const monthCol = () => curRole === 'admin' ? 'full' : 'months';
  async function writeMonth(ym, M, prevPayload){
    const sp = splitMonth(M); const b = F.writeBatch(db);
    b.set(F.doc(db, 'months', ym), { ym, payload: JSON.stringify(sp.pub), updatedAt: F.serverTimestamp() });
    b.set(F.doc(db, 'full', ym), { ym, payload: JSON.stringify(M), prev: prevPayload || null, updatedAt: F.serverTimestamp() });
    M.employees.forEach(e => { const h = hexOf(e.name); b.set(F.doc(db, 'priv', ym + '_' + h), { ym, owner: h, payload: JSON.stringify(sp.privs[e.id]), updatedAt: F.serverTimestamp() }); });
    await b.commit();
  }
  return {
    onAuth(cb){ theCb = cb; return Au.onAuthStateChanged(auth, (u) => { if (suppress) return; const i = infoOf(u); curRole = i && i.role; cb(i); }); },
    async login(role, pw){ await Au.signInWithEmailAndPassword(auth, role === 'admin' ? ADMIN_EMAIL : STAFF_EMAIL, pw); },
    async loginMember(name, pw){ await Au.signInWithEmailAndPassword(auth, memEmail(name), pw); },
    async registerMember(name, code, pw){
      suppress = true; let cred;
      try { cred = await Au.createUserWithEmailAndPassword(auth, memEmail(name), pw); } catch (e) { suppress = false; throw e; }
      try { await F.setDoc(F.doc(db, 'members', hexOf(name)), { uid: cred.user.uid, code: String(code).trim().toUpperCase(), name: String(name).trim(), at: F.serverTimestamp() }); }
      catch (e) { try { await cred.user.delete(); } catch (_) {} try { await Au.signOut(auth); } catch (_) {} suppress = false; const er = new Error('bad-code'); er.code = 'bad-code'; throw er; }
      suppress = false; const i = infoOf(auth.currentUser); curRole = i && i.role; if (theCb) theCb(i);
    },
    async changePassword(pw){ await Au.updatePassword(auth.currentUser, pw); },
    async logout(){ await Au.signOut(auth); },
    subPriv(ym, hex, cb, err){
      return F.onSnapshot(F.doc(db, 'priv', ym + '_' + hex), (s) => { if (!s.exists()) return cb(null); try { cb(JSON.parse(s.data().payload)); } catch (e) { cb(null); } }, err);
    },
    async listMembers(){
      const [m, i] = await Promise.all([F.getDocs(F.collection(db, 'members')), F.getDocs(F.collection(db, 'invites'))]);
      const out = { members: {}, invites: {} };
      m.docs.forEach(d => out.members[d.id] = d.data()); i.docs.forEach(d => out.invites[d.id] = d.data());
      return out;
    },
    async issueInvite(name){
      const al = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const a = new Uint8Array(8); crypto.getRandomValues(a);
      const code = Array.from(a).map(x => al[x % al.length]).join('');
      await F.setDoc(F.doc(db, 'invites', hexOf(name)), { code, name, at: F.serverTimestamp() });
      return code;
    },
    async unregister(name){ await F.deleteDoc(F.doc(db, 'members', hexOf(name))); },
    subMeta(cb, err){ return F.onSnapshot(F.doc(db, 'meta', 'app'), (s) => cb(s.exists() ? s.data() : { months: [], targets: {} }), err); },
    subMonth(ym, cb, err){
      return F.onSnapshot(F.doc(db, monthCol(), ym), (s) => {
        if (!s.exists()) return cb(null, null);
        const d = s.data(); let M = null; try { M = JSON.parse(d.payload); } catch (e) {}
        const ts = d.updatedAt && d.updatedAt.toMillis ? d.updatedAt.toMillis() : null;
        cb(M, ts);
      }, err);
    },
    async getMonthOnce(ym){
      const s = await F.getDoc(F.doc(db, monthCol(), ym));
      if (!s.exists()) return null;
      const d = s.data(); try { return JSON.parse(d.payload); } catch (e) { return null; }
    },
    async saveMonth(ym, M, rec, monthsList){
      const cur = await F.getDoc(F.doc(db, 'full', ym));
      const prev = cur.exists() ? (cur.data().payload || null) : null;
      await writeMonth(ym, M, prev);
      await F.setDoc(F.doc(db, 'meta', 'app'), { months: monthsList, updatedAt: F.serverTimestamp() }, { merge: true });
      await F.addDoc(F.collection(db, 'imports'), Object.assign({}, rec, { at: F.serverTimestamp(), by: auth.currentUser ? auth.currentUser.email : '' }));
    },
    async setTarget(ym, amount){
      const t = {}; t[ym] = amount;
      await F.setDoc(F.doc(db, 'meta', 'app'), { targets: t, updatedAt: F.serverTimestamp() }, { merge: true });
    },
    async listImports(){
      const q = F.query(F.collection(db, 'imports'), F.orderBy('at', 'desc'), F.limit(12));
      const s = await F.getDocs(q);
      return s.docs.map(d => { const x = d.data(); x.id = d.id; x.atMs = x.at && x.at.toMillis ? x.at.toMillis() : null; return x; });
    },
    async restorePrev(ym){
      const s = await F.getDoc(F.doc(db, 'full', ym));
      if (!s.exists() || !s.data().prev) throw new Error('戻せる履歴がありません');
      const d = s.data();
      await writeMonth(ym, JSON.parse(d.prev), d.payload);
      await F.addDoc(F.collection(db, 'imports'), { kind: 'restore', ym, at: F.serverTimestamp(), by: auth.currentUser ? auth.currentUser.email : '' });
    }
  };
}

function trendSvg(M){
  const N = M.daysInMonth || 31; const W = 340, H = 110, pad = 14;
  const vals = []; let max = 1;
  for (let i = 1; i <= N; i++) { const dd = (i < 10 ? '0' : '') + i; const v = M.days[dd] ? M.days[dd].store.gross : null; vals.push(v); if (v && v > max) max = v; }
  const bw = (W - 8) / N;
  let s = `<svg viewBox="0 0 ${W} ${H + pad}" width="100%" role="img" aria-label="営業日ごとの総売の推移">`;
  vals.forEach((v, i) => {
    const dd = (i + 1 < 10 ? '0' : '') + (i + 1); const x = 4 + i * bw;
    if (v == null) { s += `<rect x="${x + 1}" y="${H - 2}" width="${Math.max(1, bw - 2)}" height="2" fill="#2a2631"/>`; }
    else { const h = Math.max(2, v / max * (H - 8)); s += `<rect data-a="pickday" data-d="${dd}" x="${x + 1}" y="${H - h}" width="${Math.max(1, bw - 2)}" height="${h}" rx="2" fill="${dd === S.dd ? '#f3d58a' : '#b8872b'}"/>`; }
    if ((i + 1) % 5 === 0 || i === 0) s += `<text x="${x + bw / 2}" y="${H + 11}" font-size="9" fill="#9b94a6" text-anchor="middle">${i + 1}</text>`;
  });
  return s + '</svg>';
}

function rkRow(i, byDay){
  return (x) => {
    const m = MET.find(z => z.i === i);
    let sub = '';
    if (S.prevM && !byDay) {
      const pv = empMonth(S.prevM, x.id)[i];
      const hasPrev = S.prevM.employees.some(e => e.id === x.id);
      sub = hasPrev ? `<small>${delta(x.v, pv, m.unit)}</small>` : '<small class="dim">前月なし</small>';
    }
    return `<div class="rk tap r${x.rank <= 3 ? x.rank : ''}" data-a="person" data-id="${esc(x.id)}">
      <div class="no">${x.rank}</div>
      <div class="nm">${esc(x.name)}${x.kind === 'ops' ? '<small>運営</small>' : ''}</div>
      <div class="vl">${val(m, x.v)}${sub}</div></div>`;
  };
}

function viewRank(){
  const M = S.M; if (!M) return noData();
  const m = MET.find(z => z.k === S.rankMetric) || MET[0];
  const byDay = S.role === 'admin' && S.rankScope === 'day' && S.dd;
  const list = ranking(M, m.i, byDay ? S.dd : null);
  const pos = list.filter(x => x.v > 0), zero = list.filter(x => x.v === 0);
  const days = dayList(M);
  return `
  <div class="seg">${MET.map(z => `<button class="${z.k === m.k ? 'on' : ''}" data-a="rmetric" data-k="${z.k}">${z.label}</button>`).join('')}</div>
  ${S.role === 'admin' ? `<div class="seg2">
    <button class="${!byDay ? 'on' : ''}" data-a="rscope" data-s="month">${ymLabel(M.ym)} 月間</button>
    <button class="${byDay ? 'on' : ''}" data-a="rscope" data-s="day">日別</button>
  </div>` : ''}
  ${byDay ? `<div class="seg">${days.map(d => `<button class="${d === S.dd ? 'on' : ''}" data-a="pickday" data-d="${d}">${Number(d)}日</button>`).join('')}</div>` : ''}
  <div class="card">
    <h2>${byDay ? dayLabel(M.ym, S.dd) : ymLabel(M.ym) + ' 月間'}　${m.label}ランキング</h2>
    ${pos.length ? pos.map(rkRow(m.i, byDay)).join('') : '<div class="empty">この項目の実績はまだありません</div>'}
    ${(!byDay && !S.prevM) ? '<div class="note">前月のデータが入ると、前月比が表示されます。</div>' : ''}
  </div>
  <div class="note">同じ数字の人は同じ順位です。同順位の並びは名簿順です。小計と総売は別々に集計しています。${zero.length ? ` 実績0の ${zero.length}人 は表示していません。` : ''}</div>
  ${updatedLine()}`;
}

function viewGrid(M){
  const m = MET.find(z => z.k === S.gridMetric) || MET[1];
  const days = dayList(M);
  const empsAll = M.employees;
  const colTotAll = empsAll.map(e => days.reduce((a, dd) => { const r = M.days[dd].rows[e.id]; return a + (r ? r[m.i] : 0); }, 0));
  const emps = empsAll.filter((e, i) => colTotAll[i] !== 0);
  const hiddenN = empsAll.length - emps.length;
  const colTot = emps.map(e => days.reduce((a, dd) => { const r = M.days[dd].rows[e.id]; return a + (r ? r[m.i] : 0); }, 0));
  const all = days.reduce((a, dd) => a + (M.days[dd].store[m.k] || 0), 0);
  const isY = m.unit === 'yen';
  const nf = (v) => isY ? (Math.round(v / 100) / 10).toLocaleString('ja-JP', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) : fmt(v);
  const cell = (v) => v ? nf(v) : '·';
  const head = `<tr><th class="c1">日</th><th class="c2">店合計</th>${emps.map((e, i) => `<th>${esc(e.name)}</th>`).join('')}</tr>`;
  const tot = `<tr class="gt"><td class="c1">計</td><td class="c2">${nf(all)}</td>${colTot.map(v => `<td>${cell(v)}</td>`).join('')}</tr>`;
  const body = days.map(dd => { const d = M.days[dd];
    return `<tr><td class="c1" data-a="openday" data-d="${dd}">${Number(dd)}</td><td class="c2">${nf(d.store[m.k] || 0)}</td>${emps.map(e => { const r = d.rows[e.id]; const v = r ? r[m.i] : 0; return `<td class="${v ? '' : 'z'}">${cell(v)}</td>`; }).join('')}</tr>`; }).join('');
  return `<div class="seg">${MET.map(z => `<button class="${z.k === m.k ? 'on' : ''}" data-a="gmetric" data-k="${z.k}">${z.label}</button>`).join('')}</div>
  <div class="card" style="padding-left:16px;padding-right:16px"><h2>${ymLabel(M.ym)} 日別 × 人別（${m.label}${isY ? '・単位:千円' : ''}）</h2>
    <div class="gridwrap"><table class="grid"><thead>${head}</thead><tbody>${tot}${body}</tbody></table></div>
    <div class="note">左の日付をタップすると、その日の内訳が見られます。横にスワイプすると全員が見られます。この月に数字がない人（${hiddenN}人）は表から省いています。「店合計」は一覧に載せていない運営メンバー${m.k === 'gross' ? 'と担当なしの売上' : ''}を含みます。「·」は0です。</div>
  </div>`;
}

function viewDays(){
  const M = S.M; if (!M) return noData();
  if (S.dayDetail && M.days[S.dayDetail]) return viewDayDetail(S.dayDetail);
  const [y, mo] = M.ym.split('-').map(Number); const first = new Date(y, mo - 1, 1).getDay(); const N = M.daysInMonth;
  let cells = '';
  for (let i = 0; i < first; i++) cells += '<div></div>';
  for (let i = 1; i <= N; i++) {
    const dd = (i < 10 ? '0' : '') + i; const d = M.days[dd];
    cells += d ? `<div class="d has ${dd === S.dd ? 'sel' : ''}" data-a="openday" data-d="${dd}"><b>${i}</b><span>${manS(d.store.gross)}</span></div>`
               : `<div class="d none"><b>${i}</b><span style="color:#5d576a">—</span></div>`;
  }
  const toggle = `<div class="seg2"><button class="${S.dayView === 'cal' ? 'on' : ''}" data-a="dview" data-v="cal">カレンダー</button><button class="${S.dayView === 'grid' ? 'on' : ''}" data-a="dview" data-v="grid">一覧表（日×人）</button></div>`;
  if (S.role === 'admin' && S.dayView === 'grid') return toggle + viewGrid(M) + updatedLine();
  return (S.role === 'admin' ? toggle : '') + `
  <div class="card"><h2>${ymLabel(M.ym)} カレンダー（総売）</h2>
    <div class="cal">${'日月火水木金土'.split('').map(w => `<div class="dw">${w}</div>`).join('')}${cells}</div>
    <div class="note">日付をタップすると、その日の内訳が見られます。「—」はデータ未入力（または営業なし）の日で、集計には含めていません。</div>
  </div>
  ${updatedLine()}`;
}

function viewDayDetail(dd){
  const M = S.M, d = M.days[dd];
  const rows = M.employees.map(e => ({ e, r: d.rows[e.id] })).filter(x => x.r && x.r.slice(0, 8).some(n => n !== 0));
  rows.sort((a, b) => b.r[1] - a.r[1] || b.r[0] - a.r[0]);
  const hid = d.hidden || {};
  return `
  <button class="btn ghost small" data-a="backdays" style="margin-bottom:10px">← カレンダーに戻る</button>
  <div class="card">
    <h2>${dayLabel(M.ym, dd)} の店舗合計</h2>
    ${pair(d.store.gross, d.store.sub)}
    <div class="kpis" style="margin-top:12px">${[['本数', 'shimei'], ['新規', 'shinki'], ['飲み直し', 'nomi'], ['送り', 'okuri'], ['ヘルプ', 'help'], ['同伴', 'douhan']].map(([l, k]) => `<div class="kpi"><div class="v">${fmt(d.store[k])}</div><div class="l">${l}</div></div>`).join('')}</div>
  </div>
  ${S.role !== 'admin' ? `<div class="card"><h2>🔒 個人別</h2><div class="dim">個人の日別の数字は、本人の個人ログイン、または管理者だけが見られます。</div><div class="note">店舗合計には、一覧に載せていない運営メンバー分（総売 ${yen(hid.gross || 0)}）${d.unas ? `と「担当なしの売上」${yen(d.unas)}` : ''}を含みます。</div></div>` : `<div class="card"><h2>個人別</h2>
    <div class="scrollx"><table class="tbl"><thead><tr><th>名前</th><th>小計</th><th>総売</th><th>本数</th><th>新規</th><th>飲</th><th>送</th><th>ヘ</th><th>同</th></tr></thead><tbody>
    ${rows.map(({ e, r }) => `<tr class="tap" data-a="person" data-id="${esc(e.id)}"><td>${esc(e.name)}</td><td>${fmt(r[0])}</td><td>${fmt(r[1])}</td>${[2, 4, 5, 7, 6, 3].map(i => `<td class="${r[i] ? '' : 'z'}">${fmt(r[i])}</td>`).join('')}</tr>`).join('') || '<tr><td colspan="9" class="dim">実績のある人がいません</td></tr>'}
    </tbody></table></div>
    <div class="note">飲=飲み直し／送=送り／ヘ=ヘルプ指名／同=同伴。店舗合計には、一覧に載せていない運営メンバー分（総売 ${yen(hid.gross || 0)}）を含みます。${d.unas ? `<br>さらに「担当なしの売上」${yen(d.unas)}を含みます。` : ''}</div>
  </div>`}`;
}

function rowOf(e, dd){
  const d = S.M && S.M.days[dd]; if (!d) return null;
  if (S.role === 'admin') return d.rows[e.id] || null;
  if (S.role === 'member' && hexOf(e.name) === S.hex && S.priv && S.priv.days) return S.priv.days[dd] || null;
  return null;
}
function canDetail(e){ return S.role === 'admin' || (S.role === 'member' && hexOf(e.name) === S.hex); }
function viewPerson(){
  const M = S.M; if (!M) return noData();
  if (S.role === 'member' && !S.empId) { const me = M.employees.find(x => hexOf(x.name) === S.hex); if (me) S.empId = me.id; else return '<div class="card"><h2>あなたの実績</h2><div class="dim">この月の名簿にあなたの名前がありません。名前が変わった場合は、管理者に伝えてください。</div></div>'; }
  const e = M.employees.find(x => x.id === S.empId);
  if (!e && S.role !== 'member') {
    const q = S.empQuery.trim();
    const list = M.employees.filter(x => !q || x.name.includes(q));
    return `<div class="card"><h2>だれの実績を見ますか？</h2>
      <input type="text" id="empq" placeholder="名前で検索" value="${esc(S.empQuery)}" autocomplete="off" style="margin-bottom:12px">
      <div class="who">${list.map(x => `<button data-a="person" data-id="${esc(x.id)}">${esc(x.name)}${x.kind === 'ops' ? '<small>運営</small>' : ''}</button>`).join('') || '<div class="dim">見つかりません</div>'}</div></div>`;
  }
  const t = empMonth(M, e.id);
  const days = dayList(M);
  const rS = ranking(M, 0, null).find(x => x.id === e.id), rG = ranking(M, 1, null).find(x => x.id === e.id);
  const detail = canDetail(e);
  const dd = S.dd, td = dd && rowOf(e, dd);
  const pt = S.prevM && S.prevM.employees.some(x => x.id === e.id) ? empMonth(S.prevM, e.id) : null;
  const WORK = ['A出勤', 'B出勤', '遅刻'];
  const hist = days.map(d => ({ d, r: rowOf(e, d) })).filter(x => x.r && (x.r.slice(0, 8).some(n => n !== 0) || WORK.includes(x.r[8])));
  return `
  <button class="btn ghost small" data-a="persclear" style="margin-bottom:10px">${S.role === 'member' ? '← 自分の画面に戻る' : '← 人を選びなおす'}</button>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><div style="font-size:22px;font-weight:700">${esc(e.name)}</div><span class="pill">${e.kind === 'ops' ? '運営' : 'キャスト'}</span></div>
    ${!detail ? '' : td ? `<div class="hr"></div><div class="lbl">${dayLabel(M.ym, dd)}</div>${pair(td[1], td[0])}` : `<div class="note">${dd ? dayLabel(M.ym, dd) + ' は実績なし' : ''}</div>`}
  </div>
  <div class="card"><h2>${ymLabel(M.ym)} 累計</h2>
    ${pair(t[1], t[0],
      `<div class="lbl">総売 順位 ${rG && rG.v > 0 ? rG.rank + '位' : '—'}${pt ? '　' + delta(t[1], pt[1], 'yen') : ''}</div>`,
      `<div class="lbl" style="margin-top:4px">小計 順位 ${rS && rS.v > 0 ? rS.rank + '位' : '—'}${pt ? '　' + delta(t[0], pt[0], 'yen') : ''}</div>`)}
    <div class="kpis" style="margin-top:14px">${[['本数', 2], ['新規', 4], ['飲み直し', 5], ['送り', 7], ['ヘルプ指名', 6], ['同伴', 3]].map(([l, i]) => `<div class="kpi"><div class="v">${fmt(t[i])}</div><div class="l">${l}</div>${pt ? `<div class="l" style="margin-top:3px">${delta(t[i], pt[i])}</div>` : ''}</div>`).join('')}</div>
    ${pt ? `<div class="note">前月（${ymLabel(S.prevM.ym)}・${pt.days}日出勤）との差です。前月は月全体の合計です。</div>` : '<div class="note">前月のデータがない（または前月に名簿にいなかった）ため、前月比は表示していません。</div>'}
    <div class="note">月間目標は店舗全体のみです（個人目標は未設定）。</div>
  </div>
  ${!detail ? '<div class="card"><h2>🔒 日別履歴</h2><div class="dim">日別の数字は、本人の個人ログイン、または管理者だけが見られます。</div></div>' : `<div class="card"><h2>日別履歴</h2>
    <div class="scrollx"><table class="tbl"><thead><tr><th>営業日</th><th>小計</th><th>総売</th><th>本数</th><th>新規</th><th>飲</th><th>送</th><th>ヘ</th><th>同</th></tr></thead><tbody>
    ${hist.slice().reverse().map(({ d, r }) => `<tr ${S.role === 'admin' ? `class="tap" data-a="openday" data-d="${d}"` : ''}><td>${Number(M.ym.split('-')[1])}/${Number(d)}</td><td>${fmt(r[0])}</td><td>${fmt(r[1])}</td>${[2, 4, 5, 7, 6, 3].map(i => `<td class="${r[i] ? '' : 'z'}">${fmt(r[i])}</td>`).join('')}</tr>`).join('') || '<tr><td colspan="9" class="dim">実績なし</td></tr>'}
    </tbody></table></div>
    <div class="note">実績のある日と、出勤していて実績が0だった日を表示しています。出勤の記録がない日は表示していません。</div>
  </div>`}
  ${S.role === 'member' && detail ? `<div class="card"><h2>パスワードを変える</h2><input type="password" id="newpw" placeholder="新しいパスワード（6文字以上）" autocomplete="new-password"><div style="margin-top:10px"><button class="btn ghost small" data-a="chgpw">変更する</button></div></div>` : ''}
  ${updatedLine()}`;
}

/* ---------- admin ---------- */
function viewAdmin(){
  if (S.role !== 'admin') return '<div class="empty">管理者のみ使えます</div>';
  const imp = S.imp;
  return `
  <div class="card"><h2>Excelを取り込む</h2>
    <div class="note" style="margin-top:0">毎日の営業後に、更新したExcel(.xlsx)を選んでください。内容を確認してから確定します。</div>
    <input type="file" id="xfile" accept=".xlsx,.xls" style="display:none">
    <button class="btn" data-a="pickfile">Excelファイルを選ぶ</button>

  </div>
  <div class="card"><h2>${S.ym ? ymLabel(S.ym) : ''} の月間目標（総売）</h2>
    <input type="number" id="tgt" inputmode="numeric" placeholder="例: 30000000" value="${esc(S.targetDraft !== '' ? S.targetDraft : (S.meta.targets && S.meta.targets[S.ym]) || '')}">
    <div style="margin-top:10px"><button class="btn ghost small" data-a="settarget">目標を保存</button></div>
    <div class="note">表示中の月（上の ◀ ▶ で切り替え）の目標です。</div>
  </div>
  <div class="card"><h2>個人ログイン（招待コード）</h2>
    <div class="note" style="margin-top:0">本人にコードを伝えてください。本人は「個人」タブ →「初めての人は登録」で、コードと新しいパスワードを入れます。</div>
    ${!S.memberInfo ? '<button class="btn ghost small" data-a="loadmembers">登録の状況を読み込む</button>'
      : (S.M ? S.M.employees.map(e => { const h = hexOf(e.name), reg = S.memberInfo.members[h], inv = S.memberInfo.invites[h];
        return `<div class="rk"><div class="nm">${esc(e.name)}<small>${reg ? '登録済み' : (inv ? '招待コード: <b style="color:var(--gold);letter-spacing:1px">' + esc(inv.code) + '</b>' : '未招待')}</small></div>
          <div class="vl"><button class="btn ghost small" data-a="issueinv" data-n="${esc(e.name)}">${inv ? 'コード作りなおし' : 'コードを作る'}</button>${reg ? `<button class="btn ghost small" data-a="unreg" data-n="${esc(e.name)}" style="margin-top:6px">登録を解除</button>` : ''}</div></div>`; }).join('') : '<div class="dim">先に月のデータを取り込んでください</div>')}
    <div class="note">パスワードを忘れた人は「登録を解除」を押し、Firebaseの Authentication のユーザー一覧から、その人（u…@x8sales.app）を削除すると、新しいコードで登録しなおせます。</div>
  </div>
  <div class="card"><h2>取り込み履歴・変更履歴</h2>
    ${S.importsList == null ? '<button class="btn ghost small" data-a="loadimports">履歴を読み込む</button>'
      : (S.importsList.length ? S.importsList.map(importRow).join('') : '<div class="dim">履歴はまだありません</div>')}
    <div class="hr"></div>
    <button class="btn ghost small" data-a="restore">${S.ym ? ymLabel(S.ym) : ''} をひとつ前の状態に戻す</button>
    <div class="note">直前の取り込みを取り消して、その前の状態に戻します（戻したあとにもう一度押すと、元に戻ります）。</div>
  </div>
  <div class="note" style="text-align:center">ログイン: 管理者 ／ ${BUILD}</div>`;
}
function importRow(x){
  if (x.kind === 'restore') return `<div class="rk"><div class="nm">${ymLabel(x.ym)} を前の状態に復元<small>${x.atMs ? new Date(x.atMs).toLocaleString('ja-JP') : ''}</small></div></div>`;
  const c = x.changes || {};
  return `<div class="rk"><div class="nm">${esc(x.ym ? ymLabel(x.ym) : '')} ${esc(x.fileName || '')}<small>${x.atMs ? new Date(x.atMs).toLocaleString('ja-JP') : ''}　追加${c.addedDays || 0}日／変更${c.changed || 0}件／削除候補${c.removedDays || 0}日（${c.keptRemoved ? '保持' : (c.removedDays ? '削除' : '—')}）</small></div></div>`;
}
function impView(imp){
  if (imp.status === 'parsing') return '<div class="loading">Excelを読み込み中…</div>';
  if (imp.status === 'error') return `<div class="err" style="margin-top:12px">${esc(imp.msg)}</div>`;
  if (imp.status === 'saving') return '<div class="loading">保存中…</div>';
  if (imp.status === 'done') return `<div class="card" style="margin-top:12px;background:#10241d"><b class="pos">取り込みました</b><div class="note">${esc(imp.summary)}</div></div>`;
  const { res, diff } = imp, M = res.month, r = res.report;
  const tot = storeSum(M);
  const hasErr = r.errors.length > 0;
  return `<div class="hr"></div>
  <div style="font-weight:700">${esc(imp.fileName)}</div>
  <div class="note">対象月: ${ymLabel(M.ym)}　営業日(データあり): ${dayList(M).length}日　人数: ${M.employees.length}人</div>
  <div class="row2" style="margin-top:8px"><div><div class="lbl">総売 合計</div><div class="big sm">${yen(tot.gross)}</div></div><div><div class="lbl">小計 合計</div><div class="big sm">${yen(tot.sub)}</div></div></div>
  <div style="margin-top:12px">
    ${r.checks.length ? `<span class="pill bad">Excelの合計行と不一致 ${r.checks.length}件</span>` : '<span class="pill ok">Excelの合計行と一致</span>'}
    ${r.warnings.length ? `<span class="pill warn">注意 ${r.warnings.length}件</span>` : ''}
    ${hasErr ? `<span class="pill bad">エラー ${r.errors.length}件</span>` : ''}
  </div>
  ${r.checks.length ? `<ul class="list">${r.checks.slice(0, 8).map(c => `<li>${Number(c.day)}日 ${c.kind === 'cast' ? 'キャスト' : '運営'} ${esc(c.metric)}: Excel ${fmt(c.excel)} ／ 計算 ${fmt(c.computed)}</li>`).join('')}</ul>` : ''}
  ${r.warnings.length ? `<ul class="list">${r.warnings.slice(0, 6).map(w => `<li>${esc((w.day ? Number(w.day) + '日: ' : '') + w.msg)}</li>`).join('')}</ul>` : ''}
  ${hasErr ? `<ul class="list">${r.errors.slice(0, 6).map(w => `<li class="neg">${esc((w.day ? Number(w.day) + '日: ' : '') + w.msg)}</li>`).join('')}</ul>` : ''}
  <div class="note">未入力の日（集計に含めません）: ${r.emptyDays.length ? r.emptyDays.map(Number).join('、') + '日' : 'なし'}</div>
  <div class="hr"></div>
  <div style="font-weight:700">既存データとの比較</div>
  ${diff.isNew ? '<div class="note">この月は初めての取り込みです。</div>' : `
    <div class="note">新しく入る日: ${diff.addedDays.length}日 ／ 内容が変わるセル: ${diff.changed}件 ／ Excelで空になった日(削除候補): ${diff.removedDays.length}日</div>
    ${diff.changed ? `<ul class="list">${diff.list.slice(0, 10).map(c => `<li>${Number(c.day)}日 ${esc(c.name)} ${esc(c.metric)}: ${fmt(c.old)} → ${fmt(c.new)}</li>`).join('')}${diff.changed > 10 ? `<li class="dim">ほか ${diff.changed - 10}件（履歴に記録します）</li>` : ''}</ul>` : '<div class="note pos">数字の変更はありません（同じExcelの再取り込みは二重計上されません）。</div>'}
    ${diff.removedDays.length ? `<label class="chk"><input type="checkbox" id="allowrm" ${imp.allowRemove ? 'checked' : ''}><span>Excelで空になった日（${diff.removedDays.map(Number).join('、')}日）を削除する。チェックしない場合は、アプリ内のデータを残します。</span></label>` : ''}
  `}
  <div style="margin-top:14px;display:grid;gap:10px">
    <button class="btn" data-a="confirmimp" ${hasErr ? 'disabled' : ''}>この内容で取り込みを確定</button>
    <button class="btn ghost" data-a="cancelimp">やめる</button>
  </div>
  ${hasErr ? '<div class="note neg">エラーがあるため確定できません。Excelの構造が変わった可能性があります。</div>' : ''}`;
}

/* 差分と、取り込み結果の組み立て */
function computeDiff(oldM, newM){
  const out = { isNew: !oldM, addedDays: [], removedDays: [], changed: 0, list: [] };
  if (!oldM) return out;
  const nameOf = {}; oldM.employees.concat(newM.employees).forEach(e => nameOf[e.id] = e.name);
  const labels = ['小計', '総売', '本数', '同伴', '新規', '飲み直し', 'ヘルプ指名', '送り'];
  const allDays = Array.from(new Set(Object.keys(oldM.days).concat(Object.keys(newM.days)))).sort();
  allDays.forEach(dd => {
    const o = oldM.days[dd], n = newM.days[dd];
    if (n && !o) { out.addedDays.push(dd); return; }
    if (o && !n) { out.removedDays.push(dd); return; }
    const ids = Array.from(new Set(Object.keys(o.rows).concat(Object.keys(n.rows))));
    ids.forEach(id => {
      const a = o.rows[id] || [], b = n.rows[id] || [];
      for (let i = 0; i < 8; i++) {
        const x = a[i] || 0, y = b[i] || 0;
        if (x !== y) { out.changed++; if (out.list.length < 300) out.list.push({ day: dd, id, name: nameOf[id] || id, metric: labels[i], old: x, new: y }); }
      }
    });
  });
  return out;
}
function mergeMonth(oldM, newM, allowRemove){
  const days = Object.assign({}, newM.days);
  if (oldM && !allowRemove) Object.keys(oldM.days).forEach(dd => { if (!days[dd]) days[dd] = oldM.days[dd]; });
  const used = {}; Object.keys(days).forEach(dd => Object.keys(days[dd].rows).forEach(id => used[id] = 1));
  const emp = {}; (oldM ? oldM.employees : []).forEach(e => { if (used[e.id]) emp[e.id] = e; }); newM.employees.forEach(e => emp[e.id] = e);
  const order = {}; newM.employees.forEach((e, i) => order[e.id] = i);
  const employees = Object.keys(emp).sort((x, y) => (order[x] != null ? order[x] : 1e6) - (order[y] != null ? order[y] : 1e6)).map(k => emp[k]);
  return Object.assign({}, newM, { days, employees });
}

/* ---------- login ---------- */
function viewLogin(){
  const r = S.loginRole, reg = S.regMode && r === 'member', B = S.loginBusy ? 'disabled' : '';
  const tabs = [['staff', 'みんなで見る'], ['member', '個人'], ['admin', '管理者']];
  const f = (id, lbl, type, ph, ac) => `<div class="f"><label class="lbl">${lbl}</label><input type="${type}" id="${id}" placeholder="${ph}" autocomplete="${ac}" ${B}></div>`;
  let fields = '';
  if (r === 'member') fields = f('nm', 'お名前（Excelと同じ表記）', 'text', '例: るい', 'username') + (reg ? f('code', '招待コード（管理者からもらったもの）', 'text', '例: AB12CD34', 'off') + f('pw', '新しいパスワード（6文字以上）', 'password', 'パスワード', 'new-password') + f('pw2', 'もう一度', 'password', 'パスワード（確認）', 'new-password') : f('pw', '個人パスワード', 'password', 'パスワード', 'current-password'));
  else fields = f('pw', r === 'admin' ? '管理者パスワード' : 'パスワード', 'password', 'パスワード', 'current-password');
  return `<div class="login">
    <div class="logo">X8</div><div class="sub">本店 売上管理</div>
    <div class="seg2" style="margin-bottom:18px">${tabs.map(([k, l]) => `<button class="${r === k ? 'on' : ''}" data-a="logintab" data-r="${k}">${l}</button>`).join('')}</div>
    ${fields}
    <div class="err">${esc(S.loginErr)}</div>
    <button class="btn" data-a="login" ${B}>${S.loginBusy ? '確認中…' : (reg ? '登録してログイン' : 'ログイン')}</button>
    ${r === 'member' ? `<div style="margin-top:18px"><button class="iconbtn" data-a="regtoggle">${reg ? 'ログインに戻る' : '初めての人は登録（招待コードが必要）'}</button></div>` : ''}
    <div class="note" style="margin-top:18px">${r === 'member' ? '個人ログインでは、自分の日別の売上も見られます。' : r === 'staff' ? 'お店の合計とランキングが見られます。個人の日別は個人ログインで見られます。' : ''}</div>
  </div>`;
}

/* ---------- render ---------- */
function render(){
  const root = $('#root');
  if (S.phase === 'boot') { root.innerHTML = '<div class="loading">読み込み中…</div>'; return; }
  if (S.phase === 'fatal') { root.innerHTML = `<div class="login"><div class="logo">X8</div><div class="err" style="margin-top:20px">${esc(S.fatal || '接続できません')}</div><button class="btn ghost" onclick="location.reload()">再読み込み</button></div>`; return; }
  if (S.phase === 'login') { const ids = ['nm', 'code', 'pw', 'pw2']; const keep = {}; ids.forEach(k => { if ($('#' + k)) keep[k] = $('#' + k).value; }); root.innerHTML = viewLogin(); ids.forEach(k => { if (keep[k] && $('#' + k)) $('#' + k).value = keep[k]; }); return; }
  const tabs = [['home', '🏠', 'ホーム'], ['rank', '🏆', 'ランキング']];
  if (S.role === 'admin') tabs.push(['days', '📅', '日別']);
  tabs.push(['pers', '👤', '個人']);
  if (S.role === 'admin') tabs.push(['admin', '⚙️', '管理']);
  if (S.role !== 'admin' && (S.tab === 'days' || S.tab === 'admin')) S.tab = 'home';
  let body = '';
  if (S.tab === 'home') body = viewHome();
  else if (S.tab === 'rank') body = viewRank();
  else if (S.tab === 'days') body = viewDays();
  else if (S.tab === 'pers') body = viewPerson();
  else if (S.tab === 'admin') body = viewAdmin();
  const active = document.activeElement; const keepId = active && active.id; const keepSel = active && active.selectionStart;
  const sx = window.scrollX, sy = window.scrollY;
  root.innerHTML = `
  <header class="top"><div class="wrap">
    <div class="top-row"><div class="brand">X8<small>本店 売上</small></div><button class="iconbtn" data-a="logout">ログアウト</button></div>
    ${S.meta.months.length ? monthBar() : ''}
  </div></header>
  <main><div class="wrap">${body}</div></main>
  <nav class="tabs"><div class="in">${tabs.map(([k, ic, l]) => `<button class="${S.tab === k ? 'on' : ''}" data-a="tab" data-t="${k}"><span class="ic">${ic}</span>${l}</button>`).join('')}</div></nav>`;
  window.scrollTo(sx, sy);
  if (keepId) { const el = document.getElementById(keepId); if (el && el.focus) { el.focus(); try { el.setSelectionRange(keepSel, keepSel); } catch (e) {} } }
}

/* ---------- events ---------- */
document.addEventListener('click', async (ev) => {
  const el = ev.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a;
  if (a === 'tab') { S.tab = el.dataset.t; if (S.tab === 'days') S.dayDetail = null; render(); window.scrollTo(0, 0); }
  else if (a === 'mprev' || a === 'mnext') { const ms = S.meta.months, i = ms.indexOf(S.ym) + (a === 'mnext' ? 1 : -1); if (ms[i]) { S.targetDraft = ''; selectMonth(ms[i]); } }
  else if (a === 'pickday') { S.dd = el.dataset.d; render(); }
  else if (a === 'dview') { S.dayView = el.dataset.v; render(); }
  else if (a === 'gmetric') { S.gridMetric = el.dataset.k; render(); }
  else if (a === 'rmetric') { S.rankMetric = el.dataset.k; render(); }
  else if (a === 'rscope') { S.rankScope = el.dataset.s; render(); }
  else if (a === 'openday') { S.dd = el.dataset.d; S.dayDetail = el.dataset.d; S.tab = 'days'; render(); window.scrollTo(0, 0); }
  else if (a === 'backdays') { S.dayDetail = null; render(); }
  else if (a === 'person') { S.empId = el.dataset.id; if (S.role !== 'member') lsSet('x8s_emp', S.empId); S.tab = 'pers'; render(); window.scrollTo(0, 0); }
  else if (a === 'persclear') { S.empId = null; S.empQuery = ''; render(); }
  else if (a === 'logintab') { S.loginRole = el.dataset.r; S.regMode = false; S.loginErr = ''; render(); }
  else if (a === 'regtoggle') { S.regMode = !S.regMode; S.loginErr = ''; render(); }
  else if (a === 'chgpw') doChangePw();
  else if (a === 'loadmembers') loadMembers();
  else if (a === 'issueinv') doIssue(el.dataset.n);
  else if (a === 'unreg') doUnreg(el.dataset.n);
  else if (a === 'logout') { try { await backend.logout(); } catch (e) {} if (TEST) return; }
  else if (a === 'login') doLogin();
  else if (a === 'pickfile') $('#xfile').click();
  else if (a === 'cancelimp') { S.imp = null; render(); }
  else if (a === 'confirmimp') doConfirmImport();
  else if (a === 'settarget') doSetTarget();
  else if (a === 'loadimports') { try { S.importsList = await backend.listImports(); } catch (e) { toast('履歴を読み込めませんでした'); } render(); }
  else if (a === 'restore') doRestore();
});
document.addEventListener('input', (ev) => {
  if (ev.target.id === 'empq') { S.empQuery = ev.target.value; render(); }
  if (ev.target.id === 'tgt') S.targetDraft = ev.target.value;
});
document.addEventListener('change', (ev) => {
  if (ev.target.id === 'xfile' && ev.target.files && ev.target.files[0]) { const f = ev.target.files[0]; ev.target.value = ''; doParse(f); }
  if (ev.target.id === 'allowrm' && S.imp) S.imp.allowRemove = ev.target.checked;
});
document.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && ['pw', 'pw2', 'nm', 'code'].includes(ev.target.id)) doLogin(); });
window.addEventListener('online', () => { $('#offline').style.display = 'none'; });
window.addEventListener('offline', () => { $('#offline').style.display = 'block'; });

async function doLogin(){
  const v = (id) => ($('#' + id) ? $('#' + id).value : '');
  const pw = v('pw'), r = S.loginRole, reg = S.regMode && r === 'member', nm = v('nm').trim();
  if (r === 'member' && !nm) { S.loginErr = 'お名前を入力してください'; render(); return; }
  if (!pw) { S.loginErr = 'パスワードを入力してください'; render(); return; }
  if (reg) {
    if (!v('code').trim()) { S.loginErr = '招待コードを入力してください'; render(); return; }
    if (pw.length < 6) { S.loginErr = 'パスワードは6文字以上にしてください'; render(); return; }
    if (pw !== v('pw2')) { S.loginErr = '確認用のパスワードが一致しません'; render(); return; }
  }
  S.loginBusy = true; S.loginErr = ''; render();
  try {
    if (reg) await backend.registerMember(nm, v('code'), pw);
    else if (r === 'member') await backend.loginMember(nm, pw);
    else await backend.login(r, pw);
  } catch (e) {
    const c = e && e.code || '';
    S.loginErr = c === 'bad-code' ? '招待コードが違うか、まだ招待されていません。管理者に確認してください'
      : c.includes('email-already-in-use') ? 'この名前はすでに登録されています。パスワードを忘れた場合は管理者に連絡してください'
      : c.includes('weak-password') ? 'パスワードは6文字以上にしてください'
      : (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found') || c.includes('invalid-login')) ? (r === 'member' ? '名前かパスワードが違います' : 'パスワードが違います')
      : c.includes('too-many-requests') ? '試行回数が多すぎます。しばらくしてからやり直してください'
      : c.includes('network') ? '通信できません。電波を確認してください' : 'ログインできませんでした';
  }
  S.loginBusy = false; render();
}
async function doChangePw(){
  const pw = $('#newpw') ? $('#newpw').value : '';
  if (pw.length < 6) { toast('パスワードは6文字以上にしてください'); return; }
  try { await backend.changePassword(pw); $('#newpw').value = ''; toast('パスワードを変えました'); }
  catch (e) { toast((e && e.code || '').includes('requires-recent-login') ? '一度ログアウトして、入りなおしてからやり直してください' : '変更できませんでした'); }
}
async function loadMembers(){ try { S.memberInfo = await backend.listMembers(); } catch (e) { toast('読み込めませんでした'); } render(); }
async function doIssue(name){
  if (S.memberInfo && S.memberInfo.members[hexOf(name)] && !confirm(name + ' さんはすでに登録済みです。新しい招待コードを作ります（今のパスワードはそのまま使えます）。')) return;
  try { await backend.issueInvite(name); toast('招待コードを作りました'); await loadMembers(); } catch (e) { toast('作れませんでした'); }
}
async function doUnreg(name){
  if (!confirm(name + ' さんの個人登録を解除します。本人はもう一度、新しい招待コードで登録しなおす必要があります。よろしいですか？')) return;
  try { await backend.unregister(name); await backend.issueInvite(name); toast('登録を解除しました'); await loadMembers(); } catch (e) { toast('解除できませんでした'); }
}

function loadXLSX(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => res(window.XLSX); s.onerror = () => rej(new Error('Excel読み込み部品を取得できませんでした'));
    document.head.appendChild(s);
  });
}
async function doParse(file){
  S.imp = { status: 'parsing', fileName: file.name }; render();
  try {
    const XLSX = await loadXLSX();
    const buf = await file.arrayBuffer();
    const res = window.X8Parse.parseWorkbook(XLSX, new Uint8Array(buf), file.name);
    if (!res.month) { S.imp = { status: 'error', msg: res.report.errors.map(e => e.msg).join(' ') || '読み込めませんでした' }; render(); return; }
    const old = await backend.getMonthOnce(res.month.ym);
    S.imp = { status: 'preview', fileName: file.name, res, old, diff: computeDiff(old, res.month), allowRemove: false };
  } catch (e) { S.imp = { status: 'error', msg: '読み込みに失敗しました: ' + (e && e.message || e) }; }
  render();
}
async function doConfirmImport(){
  const imp = S.imp; if (!imp || imp.status !== 'preview') return;
  const { res, old, diff } = imp; const ym = res.month.ym;
  const merged = mergeMonth(old, res.month, imp.allowRemove);
  const months = Array.from(new Set(S.meta.months.concat([ym]))).sort();
  const tot = storeSum(merged);
  const rec = { kind: 'import', ym, fileName: imp.fileName, daysWithData: dayList(merged).length,
    totals: { sub: tot.sub, gross: tot.gross }, warnings: res.report.warnings.length, mismatches: res.report.checks.length,
    changes: { addedDays: diff.addedDays.length, changed: diff.changed, removedDays: diff.removedDays.length, keptRemoved: !imp.allowRemove && diff.removedDays.length > 0 },
    changeList: diff.list };
  S.imp = { status: 'saving' }; render();
  try {
    await backend.saveMonth(ym, merged, rec, months);
    S.imp = { status: 'done', summary: ymLabel(ym) + '：' + dayList(merged).length + '日分、総売 ' + yen(tot.gross) };
    S.importsList = null; toast('取り込みました');
    if (S.ym !== ym) selectMonth(ym);
  } catch (e) { S.imp = { status: 'error', msg: '保存に失敗しました。既存のデータは変更されていません。(' + (e && e.code || e && e.message || '') + ')' }; }
  render();
}
async function doSetTarget(){
  const raw = ($('#tgt') ? $('#tgt').value : '').replace(/[,\s]/g, ''); const n = Number(raw);
  if (!raw || !isFinite(n) || n < 0) { toast('金額を入力してください'); return; }
  try { await backend.setTarget(S.ym, n); S.targetDraft = ''; toast('目標を保存しました'); } catch (e) { toast('保存に失敗しました'); }
}
async function doRestore(){
  if (!S.ym) return;
  if (!confirm(ymLabel(S.ym) + ' をひとつ前の状態に戻します。よろしいですか？')) return;
  try { await backend.restorePrev(S.ym); S.importsList = null; toast('戻しました'); } catch (e) { toast(e && e.message || '戻せませんでした'); }
}

/* ---------- boot ---------- */
(async function boot(){
  render();
  if (!navigator.onLine) $('#offline').style.display = 'block';
  try { backend = TEST ? makeTestBackend() : await makeFirebaseBackend(); }
  catch (e) { S.phase = 'fatal'; S.fatal = '接続できませんでした。電波を確認して、再読み込みしてください。'; render(); return; }
  backend.onAuth((info) => {
    if (unsubMonth) { unsubMonth(); unsubMonth = null; } if (unsubMeta) { unsubMeta(); unsubMeta = null; } if (unsubPriv) { unsubPriv(); unsubPriv = null; }
    S.priv = null; S.empId = null; S.memberInfo = null; S.dayView = 'cal'; S.rankScope = 'month';
    if (!info) { S.phase = 'login'; S.role = null; S.hex = null; S.M = null; S.ym = null; S.meta = { months: [], targets: {} }; render(); return; }
    S.hex = info.hex || null; if (info.role !== 'member') S.empId = lsGet('x8s_emp') || null;
    startApp(info.role);
  });
})();
